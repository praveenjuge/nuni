name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  checks:
    name: Build, lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run format:check
      - run: bun run readmes:check
      - run: bunx turbo run build lint typecheck test
      - name: Bundle size
        run: bunx turbo run size

  reliability:
    name: Pin reliability benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bunx playwright install --with-deps chromium
        working-directory: packages/anchor
      - run: bun run bench
        working-directory: packages/anchor
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-report
          path: packages/anchor/bench-report.json

  e2e:
    name: Product end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/e2e
      - run: bun run e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
