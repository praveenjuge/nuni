name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  id-token: write # npm provenance / trusted publishing

jobs:
  release:
    if: ${{ vars.NUNI_CONVEX_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          # npm trusted publishing needs npm 11.5.1+, which ships with Node 24.
          node-version: "24"
      - name: Sync package versions from root
        run: |
          bun run version-packages
          bun install
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Sync Nuni package versions"
            git push
          fi
      - name: Build public packages
        run: bunx turbo run build $(bun scripts/public-packages.ts --filters)
        env:
          NUNI_RELEASE: "1"
          NUNI_CONVEX_URL: ${{ vars.NUNI_CONVEX_URL }}
          NUNI_CONVEX_SITE_URL: ${{ vars.NUNI_CONVEX_SITE_URL }}
          NUNI_APP_URL: https://nuni.praveenjuge.com
      - name: Publish new versions with npm trusted publishing
        run: bun run publish-packages
