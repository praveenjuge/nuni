name: Release

on:
  push:
    branches: [master]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  id-token: write # npm provenance / trusted publishing

jobs:
  release:
    if: ${{ vars.NUNI_CONVEX_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Sync package versions from root
        run: |
          bun run version-packages
          bun install
          if ! git diff --quiet -- package.json packages/widget/package.json packages/react/package.json packages/cli/package.json bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json packages/widget/package.json packages/react/package.json packages/cli/package.json bun.lock
            git commit -m "Sync Nuni package versions"
            git push
          fi
      - name: Build public packages
        run: bunx turbo run build --filter=@nuniapp/widget --filter=@nuniapp/react --filter=@nuniapp/cli
        env:
          NUNI_RELEASE: "1"
          NUNI_CONVEX_URL: ${{ vars.NUNI_CONVEX_URL }}
          NUNI_CONVEX_SITE_URL: ${{ vars.NUNI_CONVEX_SITE_URL }}
          NUNI_APP_URL: https://nuni.praveenjuge.com
      - name: Publish new versions with npm trusted publishing
        run: |
          for package_dir in packages/widget packages/react packages/cli; do
            package_name=$(node -p "require('./${package_dir}/package.json').name")
            package_version=$(node -p "require('./${package_dir}/package.json').version")
            if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
              echo "$package_name@$package_version is already published"
            else
              (cd "$package_dir" && npm publish --access public)
            fi
          done
