name: Release

on:
  push:
    branches: [master]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance / trusted publishing

jobs:
  release:
    # Skipped until production is configured (see DEPLOYING.md, step 5).
    if: ${{ vars.NUNI_CONVEX_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Version PR or publish
        uses: changesets/action@v1
        with:
          version: bun run version-packages
          publish: bun run release
          title: Version packages
          commit: Version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Baked into the published widget (see packages/widget/tsdown.config.ts)
          NUNI_RELEASE: "1"
          NUNI_CONVEX_URL: ${{ vars.NUNI_CONVEX_URL }}
          NUNI_CONVEX_SITE_URL: ${{ vars.NUNI_CONVEX_SITE_URL }}
          NUNI_APP_URL: https://nuni.praveenjuge.com
